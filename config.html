  /** One coloured band per operation under the slider (by share of the frames), each one a click target. */
  function renderSegments(sim) {
    var el = $('ac-segs'), p = state.plans[state.active];
    if (!sim || !p) { el.innerHTML = ''; el.dataset.for = ''; return; }
    if (el.dataset.for === String(state.active) && el.firstChild && el._sim === sim) return;
    var n = sim.frames.length, runs = [], start = 0;
    for (var f = 1; f <= n; f++) {
      if (f === n || sim.info[f].op !== sim.info[start].op) { runs.push([start, f, sim.info[start].op]); start = f; }
    }
    el.innerHTML = runs.map(function (r) {
      return '<i style="left:' + (r[0] / n * 100) + '%;width:' + ((r[1] - r[0]) / n * 100 + 0.2) + '%;background:' + COLORS[r[2] % COLORS.length] + '" title="' + esc(p.ops[r[2]] ? p.ops[r[2]].name : '') + '"></i>';
    }).join('') + '<b id="ac-segdim" style="left:' + ((state.frame === null ? n - 1 : state.frame) / Math.max(1, n - 1) * 100) + '%"></b>';
    el.dataset.for = String(state.active); el._sim = sim;
  }

  // ------------------------------------------------------------------ live machine setup
  function vec(t) { return String(t || '').split(',').slice(0, 3).map(Number).concat([0, 0, 0]).slice(0, 3); }

  async function readServerState() {
    try { var ss = await (await fetch(BASE_URL + '/api/server-state')).json(); return (ss && ss.machineState) || null; } catch (e) { return null; }
  }

  /** Machine position range of axis a after homing: grblHAL puts home at 0, and travel runs negative unless the axis homes
   *  to its negative end with "set machine origin to 0" ($22 bit 3). */
  function axisRange(a) {
    var fw = state.fw || {}, T = [fw.travelX, fw.travelY, fw.travelZ][a];
    if (!(T > 0)) return null;
    var neg = (fw.homeDir >> a) & 1, force = (fw.homeFlags >> 3) & 1;
    return neg && force ? [0, T] : [-T, 0];
  }

  /** G54 zero in machine coordinates (with any tool length offset or G92), or null when the machine is not connected. */
  function liveZero(ms) {
    if (!ms || !ms.connected || !ms.g54) return null;
    var ws = String(ms.workspace || 'G54').toLowerCase();
    var g54 = vec(ms.g54), act = vec(ms[ws] || ms.g54), wco = vec(ms.WCO);
    return [0, 1, 2].map(function (a) { return g54[a] + (ms.WCO ? wco[a] - act[a] : 0); });
  }

  /** Does a segment come within r of a rectangle? (Liang–Barsky on the rectangle grown by r.) */
  function segHitsBox(x0, y0, x1, y1, b, r) {
    var lo = 0, hi = 1, dx = x1 - x0, dy = y1 - y0;
    var P = [-dx, dx, -dy, dy], Q = [x0 - (b[0] - r), b[2] + r - x0, y0 - (b[1] - r), b[3] + r - y0];
    for (var k = 0; k < 4; k++) {
      if (P[k] === 0) { if (Q[k] < 0) return false; continue; }
      var t = Q[k] / P[k];
      if (P[k] < 0) { if (t > hi) return false; if (t > lo) lo = t; } else { if (t < lo) return false; if (t < hi) hi = t; }
    }
    return true;
  }

  /** Where setup i, run from the live G54 zero, enters a keep-out zone (the ATC rack): null when it can't be told. */
  function keepoutHits(i) {
    var zones = state.keepout || [], p = state.plans[i];
    if (!zones.length || !p) return { zones: 0, hits: [] };
    var zero = liveZero(state.live);
    if (!zero) return null;
    var o = p.origin, dx = zero[0] - o.x, dy = zero[1] - o.y, hits = [];
    zones.forEach(function (z) {
      var b = [z.minX, z.minY, z.maxX, z.maxY], name = z.name || 'Keep-out zone';
      var st = p.stock;
      if (segHitsBox(st.x0 + dx, st.y0 + dy, st.x1 + dx, st.y0 + dy, b, 0) || segHitsBox(st.x0 + dx, st.y1 + dy, st.x1 + dx, st.y1 + dy, b, 0) ||
          segHitsBox(st.x0 + dx, st.y0 + dy, st.x0 + dx, st.y1 + dy, b, 0) || segHitsBox(st.x1 + dx, st.y0 + dy, st.x1 + dx, st.y1 + dy, b, 0) ||
          (b[0] > st.x0 + dx && b[2] < st.x1 + dx && b[1] > st.y0 + dy && b[3] < st.y1 + dy)) {
        hits.push({ zone: name, what: 'The stock block', at: null });
      }
      p.ops.forEach(function (op) {
        // A V-bit's cone is up to its 1/4" shank wide; anything else by its diameter.
        var r = op.tool.kind === 'spot' ? Math.max(op.tool.diameter / 2, 3.2) : op.tool.diameter / 2, m = op.moves, n = 0, first = null;
        for (var k = 4; k < m.length; k += 4) {
          if (segHitsBox(m[k - 4] + dx, m[k - 3] + dy, m[k] + dx, m[k + 1] + dy, b, r)) { n++; if (!first) first = [m[k] - o.x, m[k + 1] - o.y]; }
        }
        if (n) hits.push({ zone: name, what: op.name + ' (T' + op.tool.number + ')', n: n, at: first });
      });
    });
    return { zones: zones.length, hits: hits };
  }

  function keepoutText(h) {
    return h.what + (h.n ? ': ' + h.n + ' move' + (h.n > 1 ? 's' : '') + ', first at X' + fmt(h.at[0]) + ' Y' + fmt(h.at[1]) : ' overlaps it');
  }

  /** What the live machine state means for setup i: [[level, text], ...]. */
  function liveRows(i) {
    var ms = state.live, p = state.plans[i], u = state.uiChecks[i], rows = [];
    state.liveSpindle = null;
    if (!ms || !ms.connected) return [['wn', 'The machine is not connected: connect it in ncSender to check the setup here.']];
    var ws = String(ms.workspace || 'G54').toUpperCase();
    var g54 = vec(ms.g54), act = vec(ms[ws.toLowerCase()] || ms.g54), wco = vec(ms.WCO), mpos = vec(ms.MPos);
    var tlo = [0, 1, 2].map(function (a) { return wco[a] - act[a]; }); // tool length offset (and any G92)
    var zero = [0, 1, 2].map(function (a) { return g54[a] + tlo[a]; });
    var w = [0, 1, 2].map(function (a) { return mpos[a] - zero[a]; }); // spindle in G54 work coordinates
    rows.push(ws === 'G54' ? ['ok', 'ncSender is on G54, the work offset the program uses'] : ['fail', 'ncSender is on ' + ws + ', but the program uses G54: set the zero in G54']);
    rows.push(['ok', 'G54 zero at machine X ' + fmt(g54[0]) + '  Y ' + fmt(g54[1]) + '  Z ' + fmt(g54[2])]);
    // Travel with this zero
    if (!ms.homed) rows.push(['wn', 'Not homed: home the machine so the soft limits can be checked']);
    else if (u && u.mn) {
      var over = [];
      ['X', 'Y', 'Z'].forEach(function (ax, a) {
        var r = axisRange(a); if (!r) return;
        var lo = zero[a] + u.mn[a], hi = zero[a] + u.mx[a];
        if (lo < r[0] - 0.5) over.push(ax + ' goes to ' + fmt(lo) + ', ' + fmt(r[0] - lo) + ' mm past the ' + ax + '− limit (' + fmt(r[0]) + ')');
        if (hi > r[1] + 0.5) over.push(ax + ' goes to ' + fmt(hi) + ', ' + fmt(hi - r[1]) + ' mm past the ' + ax + '+ limit (' + fmt(r[1]) + ')');
      });
      if (over.length) over.forEach(function (t) { rows.push(['fail', 'With this zero the job hits a limit: ' + t + (t[0] === 'Z' ? ' (with the tool in the spindle now)' : '')]); });
      else rows.push(['ok', 'With this zero the whole job stays inside the machine travel' + (state.fw.softLimits === 1 ? ' and soft limits' : '')]);
    }
    var ko = keepoutHits(i);
    if (ko && ko.zones) {
      if (ko.hits.length) rows.push(['fail', 'With this zero the job goes into the ' + ko.hits[0].zone + ': ' +
        ko.hits.map(function (h) { return h.n ? h.what.replace(/ \(T\d+\)$/, '') : 'the stock block'; }).join(', ') + '. Loading is blocked.']);
      else rows.push(['ok', 'With this zero the job and stock stay out of the ' + state.keepout.map(function (z) { return z.name || 'keep-out zone'; }).join(', ')]);
    }
    // Where the spindle is, relative to the stock
    var st = p.stock, o = p.origin, x = o.x + w[0], y = o.y + w[1];
    var inside = x >= st.x0 - 0.5 && x <= st.x1 + 0.5 && y >= st.y0 - 0.5 && y <= st.y1 + 0.5;
    var where = Math.abs(w[0]) < 0.3 && Math.abs(w[1]) < 0.3 ? 'right over the zero (' + zeroText() + ')'
      : inside ? 'over the stock' : 'outside the stock';
    var top = w[2] - (st.z1 - o.z); // height above the stock top, whichever Z zero is used
    var high = top >= -0.05 ? fmt(top) + ' mm above the stock top' : fmt(-top) + ' mm below the stock top';
    rows.push([inside && top < -0.05 ? 'wn' : 'ok', 'Spindle at X ' + fmt(w[0]) + '  Y ' + fmt(w[1]) + '  Z ' + fmt(w[2]) + ': ' + where + ', ' + high]);
    // Setup 2 needs a fresh zero after turning the block over
    var L = cfg.loaded;
    if (i === 1) {
      if (!L || L.file !== state.fileName || L.setup !== 0 || !L.g54) rows.push(['wn', 'Setup 1 of this part has not been loaded from AutoCAM yet: run setup 1 first']);
      else if ([0, 1, 2].every(function (a) { return Math.abs(L.g54[a] - g54[a]) < 0.005; }))
        rows.push(['wn', 'G54 has not changed since setup 1 was loaded. Zero again on the turned-over block (unless a vise stop keeps X/Y and the top is at the same height).']);
      else rows.push(['ok', 'G54 was set again after setup 1 (Z moved ' + fmt(g54[2] - L.g54[2]) + ' mm)']);
    }
    state.liveSpindle = state.live ? [x, y, o.z + w[2]] : null;
    return rows;
  }

  function liveBody() {
    var icon = { ok: '✓', wn: '⚠', fail: '✗' }, color = { ok: 'var(--ac-ok)', wn: 'var(--ac-warn)', fail: '#e5484d' };
    return liveRows(state.active).map(function (r) { return '<li><b style="color:' + color[r[0]] + '">' + icon[r[0]] + '</b><span>' + esc(r[1]) + '</span></li>'; }).join('');
  }

  function liveCard() {
    return '<div class="ac-card"><h4><span class="ac-dot' + (state.live && state.live.connected ? '' : ' ac-hidden') + '"></span>Machine setup · live</h4><ul class="ac-live" id="ac-live" style="list-style:none;margin:0;padding:0">' +
      liveBody() + '</ul><div class="ac-hint">Jog to the zero: the red marker in the 3D view should sit on the zero arrows (' + esc(zeroText()) + ').</div></div>';
  }

  /** Red marker in the 3D view where the spindle is now. */
  function showSpindle() {
    if (!V) return;
    var T = window.__autocamTHREE, pt = state.step === 3 && state.plans[state.active] ? state.liveSpindle : null;
    if (!V.spindle) {
      V.spindle = new T.Group();
      var cone = new T.Mesh(new T.ConeGeometry(0.5, 1.6, 20), new T.MeshBasicMaterial({ color: 0xe5484d }));
      cone.rotation.x = -Math.PI / 2; cone.position.z = 0.8;
      V.spindle.add(cone);
      var g = new T.BufferGeometry().setFromPoints([new T.Vector3(0, 0, 1.6), new T.Vector3(0, 0, 6)]);
      V.spindle.add(new T.Line(g, new T.LineBasicMaterial({ color: 0xe5484d })));
      V.scene.add(V.spindle);
    }
    V.spindle.visible = !!pt;
    if (pt) {
      var st = state.plans[state.active].stock;
      V.spindle.scale.setScalar(Math.max(1.5, Math.hypot(st.x1 - st.x0, st.y1 - st.y0) * 0.02));
      V.spindle.position.set(pt[0], pt[1], pt[2]);
    }
    render();
  }

  async function pollLive() {
    if (state.step !== 3 || !state.plans.length || state.livePolling) return;
    state.livePolling = true;
    state.live = await readServerState();
    state.livePolling = false;
    var ko = keepoutHits(state.active), sig = ko ? JSON.stringify(ko.hits.map(keepoutText)) : 'none';
    if (sig !== state.koSig) { state.koSig = sig; renderPanel(); renderFooter(); }
    var el = $('ac-live');
    if (el) {
      el.innerHTML = liveBody();
      var dot = el.parentNode.querySelector('.ac-dot');
      if (dot) dot.classList.toggle('ac-hidden', !(state.live && state.live.connected));
    }
    showSpindle();
  }

  // ------------------------------------------------------------------ pre-flight checks
  async function runChecks() {
    var plans = state.checking = state.plans;
    for (var i = 0; i < plans.length; i++) {
      try {
        var sim = await call('simulate', { index: i });
        if (state.plans !== plans) return; // regenerated meanwhile
        state.sims[i] = sim;
        state.uiChecks[i] = await machineChecks(i);
      } catch (e) {
        state.uiChecks[i] = { error: e.message };
        state.sims[i] = null;
        console.error('[AutoCAM] simulation failed', e);
      }
      if (i === state.active && state.sims[i]) {
        state.simMode = 'sim'; state.frame = 0;
        if (state.step === 3) { refreshScene(false); play(); }
      }
      renderAll();
    }
  }

  /** Checks against ncSender itself: the tool table right now, the machine's limits and travel. */
  async function machineChecks(i) {
    var p = state.plans[i], out = { tools: [], limits: [], travel: [], span: '' };
    var now = [];
    try { now = await (await fetch(BASE_URL + '/api/tools/active')).json(); } catch (e) { out.tools.push('Could not read the tool table from ncSender.'); }
    var seen = {}, fw = state.fw || {};
    p.ops.forEach(function (op) {
      var t = op.tool, c = op.cutting;
      if (!seen[t.number]) {
        seen[t.number] = 1;
        var cur = (now || []).filter(function (x) { return x.toolId === t.number; })[0];
        if (!cur || !(cur.diameter > 0)) out.tools.push('T' + t.number + ' (' + t.label + ') is not in ncSender’s tool table any more');
        else if (Math.abs(cur.diameter - t.diameter) > 0.01) out.tools.push('T' + t.number + ' is Ø' + cur.diameter + ' in ncSender now; the program was made for Ø' + t.diameter);
      }
      if (fw.maxRpm > 0 && c.rpm > fw.maxRpm + 0.5) out.limits.push(op.name + ': S' + c.rpm + ' is above the spindle maximum ($30 = ' + fw.maxRpm + ')');
      if (fw.minRpm > 0 && c.rpm < fw.minRpm - 0.5) out.limits.push(op.name + ': S' + c.rpm + ' is below the spindle minimum ($31 = ' + fw.minRpm + ')');
      var xy = Math.min(fw.rateX > 0 ? fw.rateX : Infinity, fw.rateY > 0 ? fw.rateY : Infinity);
      if (c.feed > xy) out.limits.push(op.name + ': F' + c.feed + ' is above the X/Y max rate ($110/$111 = ' + xy + ')');
      if (fw.rateZ > 0 && Math.max(c.plunge, c.ramp) > fw.rateZ) out.limits.push(op.name + ': plunge/ramp F' + Math.max(c.plunge, c.ramp) + ' is above the Z max rate ($112 = ' + fw.rateZ + '); grblHAL will slow those moves');
    });
    var o = p.origin, mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    p.ops.forEach(function (op) {
      for (var k = 0; k < op.moves.length; k += 4) for (var a = 0; a < 3; a++) {
        var v = op.moves[k + a] - [o.x, o.y, o.z][a];
        if (v < mn[a]) mn[a] = v; if (v > mx[a]) mx[a] = v;
      }
    });
    var spans = [0, 1, 2].map(function (a) { return mx[a] - mn[a]; }), travel = [fw.travelX, fw.travelY, fw.travelZ];
    out.span = spans.map(function (v) { return fmt(v); }).join(' × ') + ' mm';
    out.mn = mn; out.mx = mx;
    ['X', 'Y', 'Z'].forEach(function (ax, a) {
      if (travel[a] > 0 && spans[a] > travel[a]) out.travel.push(ax + ' moves span ' + fmt(spans[a]) + ' mm but the machine travels ' + fmt(travel[a]) + ' mm ($13' + a + ')');
    });
    return out;
  }

  function checkRows(i) {
    var sim = state.sims[i], u = state.uiChecks[i], p = state.plans[i];
    if (!u) return null;
    if (u.error) return [{ level: 'fail', title: 'The simulation failed: ' + u.error, items: [] }];
    if (!sim) return null;
    var c = sim.checks, rows = [];
    function row(level, title, items) { rows.push({ level: level, title: title, items: items || [] }); }
    function f2(v) { return (Math.round(v * 100) / 100).toString(); }
    var gouged = c.gougeMax > 0.05;
    row(gouged ? 'fail' : 'pass', gouged ? 'Cuts into the part: up to ' + f2(c.gougeMax) + ' mm deep over ' + Math.round(c.gougeArea) + ' mm² (red)' : 'Never cuts into the part',
      c.gouges.map(function (g) { return g.op + ' (' + g.tool + '), ' + f2(g.depth) + ' mm at ' + g.at; }));
    row(c.rapids.length ? 'fail' : 'pass', c.rapids.length ? c.rapids.length + ' rapid move' + (c.rapids.length > 1 ? 's go' : ' goes') + ' through material' : 'No rapid moves through material',
      c.rapids.map(function (g) { return g.op + ' (' + g.tool + '), ' + f2(g.depth) + ' mm into stock at ' + g.at; }));
    row(c.flute.length ? 'fail' : 'pass', c.flute.length ? 'Cuts deeper than the flutes in ' + c.flute.length + ' place' + (c.flute.length > 1 ? 's' : '') : 'Every cut is within the flute length',
      c.flute.map(function (g) { return g.op + ' (' + g.tool + '): ' + f2(g.depth) + ' mm of stock on a ' + g.flute + ' mm flute at ' + g.at; }));
    row(c.plunges.length ? 'warn' : 'pass', c.plunges.length ? c.plunges.length + ' straight plunge' + (c.plunges.length > 1 ? 's' : '') + ' into solid material' : 'No straight plunges into solid material',
      c.plunges.map(function (g) { return g.op + ' (' + g.tool + '), ' + f2(g.depth) + ' mm at ' + g.at; }));
    // Areas under 0.5 mm² are the simulation grid's own resolution, not material left behind.
    var real = (c.uncutAreas || []).filter(function (a) { return a.area >= 0.5; });
    var leftArea = real.reduce(function (t, a) { return t + a.area; }, 0), leftMax = real.reduce(function (t, a) { return Math.max(t, a.high); }, 0);
    var left = leftArea > 1;
    row(left ? 'warn' : 'pass', left ? 'About ' + Math.round(leftArea) + ' mm² left uncut, up to ' + f2(leftMax) + ' mm high (orange)' : 'Everything reachable is cut',
      real.map(function (a) {
        return f2(a.area) + ' mm², up to ' + f2(a.high) + ' mm high, around ' + a.at.replace(/ Z-?[\d.]+$/, '');
      }));
    row(u.tools.length ? 'fail' : 'pass', u.tools.length ? 'Tools changed in ncSender' : 'Tools match ncSender’s tool table', u.tools);
    row(u.limits.length ? 'warn' : 'pass', u.limits.length ? 'Speeds or feeds outside the machine limits' : 'Speeds and feeds within the machine limits', u.limits);
    row(u.travel.length ? 'fail' : 'pass', u.travel.length ? 'Does not fit the machine travel' : 'Fits the machine travel (' + u.span + ')', u.travel);
    if ((state.keepout || []).length) {
      var ko = keepoutHits(i), zn = state.keepout.map(function (z) { return z.name || 'keep-out zone'; }).join(', ');
      if (!ko) row('warn', 'Not checked against the ' + zn + ': connect the machine so AutoCAM can read the G54 zero', []);
      else row(ko.hits.length ? 'fail' : 'pass', ko.hits.length ? 'Goes into the ' + zn + ' with the current G54 zero: move the zero or the stock'
        : 'Stays out of the ' + zn + ' with the current G54 zero', ko.hits.map(function (h) { return h.zone + ': ' + keepoutText(h); }));
    }
    row(c.gcode.length ? 'fail' : 'pass', c.gcode.length ? c.gcode.length + ' G-code line' + (c.gcode.length > 1 ? 's' : '') + ' grblHAL would reject' : 'G-code valid for grblHAL',
      c.gcode.map(function (b) { return 'line ' + b.line + ': ' + b.text + ' (' + b.why + ')'; }));
    var notes = p.warnings.filter(function (w) { return !/frame outside/.test(w); });
    if (notes.length) row('warn', notes.length + ' note' + (notes.length > 1 ? 's' : '') + ' from planning', notes);
    return rows;
  }

  function verdict(i) {
    var rows = checkRows(i);
    if (!rows) return null;
    var ko = keepoutHits(i);
    return { rows: rows, fails: rows.filter(function (r) { return r.level === 'fail'; }).length, warns: rows.filter(function (r) { return r.level === 'warn'; }).length,
      keepout: !!(ko && ko.hits.length) };
  }

  function checksCard() {
    var i = state.active, v = verdict(i), two = state.plans.length > 1;
    var head = '<h4>Pre-flight checks' + (two ? ' · setup ' + (i + 1) : '') + '</h4>';
    if (!v) return '<div class="ac-card">' + head + '<div class="ac-verdict"><span class="ac-spin"></span>Simulating the cut and checking the program…</div></div>';
    var icon = { pass: '✓', warn: '⚠', fail: '✗' }, cls = { pass: 'ac-pass', warn: 'ac-wn', fail: 'ac-fail' };
    var verdictText = v.fails ? '<b style="color:#e5484d">✗ ' + v.fails + ' problem' + (v.fails > 1 ? 's' : '') + ' found: loading is blocked</b>'
      : v.warns ? '<b style="color:var(--ac-warn)">⚠ Ready to load, with ' + v.warns + ' warning' + (v.warns > 1 ? 's' : '') + '</b>'
      : '<b style="color:var(--ac-ok)">✓ All checks passed</b>';
    var html = '<div class="ac-card">' + head + '<div class="ac-verdict">' + verdictText + '</div><ul class="ac-checks">' + v.rows.map(function (r) {
      var body = '<b>' + icon[r.level] + '</b><span>' + esc(r.title) + '</span>';
      return '<li class="' + cls[r.level] + '">' + (r.items.length ? '<details' + (r.level === 'fail' ? ' open' : '') + '><summary>' + body + '</summary><ul>' +
        r.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></details>' : '<div style="display:flex;gap:8px">' + body + '</div>') + '</li>';
    }).join('') + '</ul>';
    if (v.keepout) html += '<div class="ac-hint" style="color:#e5484d">Loading stays blocked while the job reaches into the ATC / keep-out zone: set G54 elsewhere, or move the stock.</div>';
    else if (v.fails) html += '<label class="ac-override"><input type="checkbox" data-override="' + i + '"' + (state.override[i] ? ' checked' : '') +
      '><span>I’ve checked these problems and want to load this program anyway.</span></label>';
    return html + '</div>';
  }

  /** Run time, tools and tool changes at a glance, and the name the program gets in ncSender. */
  function statsCard() {
    var p = state.plans[state.active], nums = [], changes = 0, prev = null;
    p.ops.forEach(function (op) {
      if (nums.indexOf(op.tool.number) < 0) nums.push(op.tool.number);
      if (prev !== null && op.tool.number !== prev) changes++;
      prev = op.tool.number;
    });
    var g = state.gcodes[state.active] || '', mins = Math.max(1, Math.round(p.seconds / 60));
    return '<div class="ac-card ac-stats"><div><b>' + mins + '<small> min</small></b><span>Run time</span></div>' +
      '<div><b>' + nums.length + '</b><span>Tool' + (nums.length === 1 ? '' : 's') + ' · ' + nums.map(function (n) { return 'T' + n; }).join(' ') + '</span></div>' +
      '<div><b>' + changes + '</b><span>Tool change' + (changes === 1 ? '' : 's') + '</span></div>' +
      '<p title="The name the program gets in ncSender and in the File Manager">' + esc(programName(state.active)) + ' · ' + g.split('\n').length.toLocaleString() + ' lines</p></div>';
  }

  function panelPreview() {
    var p = state.plans[state.active];
    if (!p) return '<div class="ac-card"><div class="ac-hint" style="margin:0">Generate toolpaths on the Operations step.</div></div>';
    var html = statsCard() + checksCard() + placementCard(state.active, true) + liveCard();
    if (p.notes && p.notes.length) html += '<div class="ac-note"><span>ⓘ</span><span>' + p.notes.map(esc).join(' ') + '</span></div>';
    html += '<div class="ac-card"><h4>Operations</h4><ul class="ac-ops">' + p.ops.map(function (op, i) {
      return '<li><input type="checkbox" data-op="' + i + '"' + (state.hidden[i] ? '' : ' checked') + '><i style="background:' + COLORS[i % COLORS.length] + '"></i>' +
        '<div>' + esc(op.name) + '<small>' + esc(op.tool.label) + ' · ' + op.cutting.rpm + ' rpm · F' + op.cutting.feed + '</small></div><em>' + fmtTime(op.seconds) + '</em></li>';
    }).join('') + '</ul><div class="ac-total"><span>Total, with tool changes</span><span>' + fmtTime(p.seconds) + '</span></div>' +
      '<div class="ac-hint">Stock ' + fmt(p.stock.x1 - p.stock.x0) + ' × ' + fmt(p.stock.y1 - p.stock.y0) + ' × ' + fmt(p.stock.z1 - p.stock.z0) +
      ' mm · G54 zero: ' + esc(zeroText()) + ' · tool changes as M6 T&lt;n&gt;</div></div>';
    return html;
  }

  // ------------------------------------------------------------------ events
  $('ac-close').addEventListener('click', close);
  $('ac-open').addEventListener('click', function () { $('ac-file').click(); });
  $('ac-file').addEventListener('change', function (e) { openFile(e.target.files[0]); e.target.value = ''; });
  var viewer = $('ac-viewer');
  ['dragover', 'dragenter'].forEach(function (ev) { viewer.addEventListener(ev, function (e) { e.preventDefault(); $('ac-drop').classList.add('ac-over'); }); });
  viewer.addEventListener('dragleave', function () { $('ac-drop').classList.remove('ac-over'); });
  viewer.addEventListener('drop', function (e) { e.preventDefault(); $('ac-drop').classList.remove('ac-over'); if (state.step === 0) openFile(e.dataTransfer.files[0]); });
  $('ac-steps').addEventListener('click', function (e) {
    var b = e.target.closest('[data-step]');
    if (!b || b.disabled) return;
    goto(Number(b.dataset.step));
    if (state.step === 2 && !state.plans.length) planSoon();
  });
  $('ac-back').addEventListener('click', function () { if (state.step > 0) goto(state.step - 1); });
  $('ac-next').addEventListener('click', function () {
    if (state.step === 0) { state.maxStep = Math.max(state.maxStep, 1); goto(1); }
    else if (state.step === 1) { state.maxStep = Math.max(state.maxStep, 2); goto(2); if (!state.plans.length) planSoon(); }
    else if (state.step === 2) generate();
    else loadIntoSender();
  });
  $('ac-save').addEventListener('click', saveToFiles);
  $('ac-download').addEventListener('click', download);
  $('ac-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-setup]');
    if (!b) return;
    state.active = Number(b.dataset.setup); state.hidden = {}; stopPlay(); state.frame = null;
    refreshScene(true); renderAll();
  });
  $('ac-play').addEventListener('click', function (e) {
    var m = e.target.closest('[data-mode]');
    if (m && !m.disabled) { stopPlay(); state.simMode = m.dataset.mode; refreshScene(false); renderPlayBar(); }
    if (e.target.id === 'ac-pbtn') play();
  });
  $('ac-slider').addEventListener('input', function () { stopPlay(); showFrame(Number(this.value)); });
  $('ac-speed').addEventListener('change', function () {
    state.speed = Number(this.value) || 1;
    if (state.playing) { stopPlay(); play(); }
  });
  var panel = $('ac-panel');
  panel.addEventListener('click', function (e) {
    if (e.target.closest('#ac-open2')) { $('ac-file').click(); return; }
    var mat = e.target.closest('[data-material]');
    if (mat) { cfg.material = mat.dataset.material; tintPart(); changed(); return; }
    var org = e.target.closest('[data-origin]');
    if (org) { setOrigin(org.dataset.origin); return; }
    var side = e.target.closest('[data-up]');
    if (side) { state.picked = true; setUp(side.dataset.up); return; }
    if (e.target.closest('#ac-turn')) { turnOnTable(); return; }
    if (e.target.id === 'ac-refresh') readTools().then(renderAll);
  });
  panel.addEventListener('change', function (e) {
    var el = e.target;
    if (el.dataset.cfg) {
      var v = parseFloat(el.value);
      if (isNaN(v)) { el.value = cfg[el.dataset.cfg]; return; }
      cfg[el.dataset.cfg] = v;
    } else if (el.dataset.cfgSelect) {
      cfg[el.dataset.cfgSelect] = el.value;
    } else if (el.dataset.optool) {
      cfg.opTools = Object.assign({}, cfg.opTools);
      if (el.value) cfg.opTools[el.dataset.optool] = Number(el.value); else delete cfg.opTools[el.dataset.optool];
    } else if (el.dataset.opoff) {
      cfg.opsOff = Object.assign({}, cfg.opsOff);
      cfg.opsOff[el.dataset.opoff] = !el.checked;
    } else if (el.name === 'origin' || el.name === 'setups') {
      cfg[el.name] = el.value;
    } else if (el.name === 'bottom') {
      cfg.skin = el.value === 'through' ? (cfg.skin <= 0 ? cfg.skin : -0.2) : (cfg.skin > 0 ? cfg.skin : 1);
    } else if (el.name === 'outside') {
      cfg.outside = el.value;
    } else if (el.name === 'tabs') {
      cfg.tabs = el.checked;
    } else if (el.name === 'zzero') {
      cfg.zZero = el.value;
    } else if (el.name === 'finish') {
      var F = FINISH[el.value];
      cfg.leave = F.leave; cfg.slopeStep = F.slopeStep;
      cfg.opsOff = Object.assign({}, cfg.opsOff, { finish: F.off });
    } else if (el.dataset.override !== undefined) {
      state.override[el.dataset.override] = el.checked;
      renderFooter();
      return;
    } else if (el.dataset.op !== undefined) {
      state.hidden[el.dataset.op] = !el.checked;
      refreshScene(false);
      return;
    } else if (el.dataset.k) {
      var row = el.closest('tr'), t = row.dataset.t, o = cfg.tools[t] = cfg.tools[t] || {};
      if (el.dataset.k === 'enabled') o.enabled = el.checked;
      else { var n = parseFloat(el.value); if (n > 0) o[el.dataset.k] = n; else delete o[el.dataset.k]; }
    } else return;
    changed();
  });
  panel.addEventListener('toggle', function (e) { if (e.target.id === 'ac-more') state.moreOpen = e.target.open; }, true);
  $('ac-segs').addEventListener('click', function (e) { e.stopPropagation(); });

  (async function init() {
    $('ac-logo').src = fileUrl('logo.png');
    fetchText('manifest.json').then(function (t) { $('ac-ver').textContent = 'STEP → G-code · v' + JSON.parse(t).version; }).catch(function () {});
    renderAll();
    var machine = readMachine();
    state.machineReady = machine.then(readTools);
    await machine;
    try {
      await libs();
      initViewer();
      setStatus('');
    } catch (e) {
      setStatus('Could not load AutoCAM: ' + e.message);
    }
    await state.machineReady;
    state.poll = setInterval(function () { if (!ROOT.isConnected) { shutdown(); return; } pollConnection(); }, 5000);
    state.livePoll = setInterval(function () { if (ROOT.isConnected) pollLive(); }, 1000);
    renderAll();
  })();
})();
</script>
