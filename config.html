<style>
  .plugin-dialog-header { display: none !important; }
  .plugin-dialog-content { padding: 0 !important; }

  #ac-root.ac-wrap {
    --ac-bg: var(--color-surface, #ffffff);
    --ac-soft: var(--color-surface-muted, #f3f5f8);
    --ac-text: var(--color-text-primary, #1f2937);
    --ac-text2: var(--color-text-secondary, #6b7280);
    --ac-line: var(--color-border, #e3e7ee);
    --ac-accent: var(--color-accent, #3b5bdb);
    --ac-ok: #22a06b; --ac-pocket: #2bb3a3; --ac-hole: #3b82f6; --ac-outline: #8b5cf6; --ac-warn: #d97706;
    /* Scale with the screen: 1 unit is 1px up to about 1700 px wide, growing to 1.3px on big monitors. */
    --ac-u: clamp(1px, 0.06vw, 1.3px);
    width: 96vw; max-width: 2600px; height: 92vh; max-height: 1500px;
    display: grid; grid-template-columns: clamp(180px, 11vw, 250px) 1fr; overflow: hidden;
    background: var(--ac-bg); color: var(--ac-text); border-radius: 14px; font-size: calc(13 * var(--ac-u));
    font-family: inherit;
  }
  #ac-root.ac-wrap * { box-sizing: border-box; }
  /* ncSender styles every <button>; inside the plugin only our own button styles apply. */
  #ac-root button { margin: 0; box-shadow: none; text-transform: none; letter-spacing: normal; min-height: 0; min-width: 0;
    height: auto; width: auto; line-height: 1.2; font: inherit; background: transparent; color: inherit; border: 0; padding: 0; }

  #ac-root .ac-side { background: var(--ac-soft); border-right: 1px solid var(--ac-line); display: flex; flex-direction: column; padding: 14px 10px; }
  #ac-root .ac-brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 16px; }
  #ac-root .ac-brand img { width: 34px; height: 34px; border-radius: 9px; flex: none; background: var(--ac-bg); }
  #ac-root .ac-brand b { display: block; font-size: calc(16 * var(--ac-u)); letter-spacing: -.01em; }
  #ac-root .ac-brand span { display: block; color: var(--ac-text2); font-size: calc(11 * var(--ac-u)); margin-top: 1px; }
  /* Steps as a progress rail: a line joins the step dots, filled up to the current step. */
  #ac-root .ac-steps { display: flex; flex-direction: column; flex: 1; }
  #ac-root .ac-stepbtn { position: relative; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 1px 10px; padding: 8px 8px 14px; border-radius: 9px;
    background: transparent; color: var(--ac-text2); font: inherit; text-align: left; cursor: pointer; align-items: center; }
  #ac-root .ac-stepbtn:disabled { cursor: default; opacity: .5; }
  #ac-root .ac-stepbtn i { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    font-style: normal; font-size: calc(11 * var(--ac-u)); font-weight: 600; background: var(--ac-bg); border: 2px solid var(--ac-line); color: var(--ac-text2); }
  #ac-root .ac-stepbtn:not(:last-child)::after { content: ''; position: absolute; left: 18px; top: 32px; bottom: -8px; width: 2px; background: var(--ac-line); }
  #ac-root .ac-stepbtn.ac-done::after { background: var(--ac-accent); }
  #ac-root .ac-stepbtn span { font-weight: 600; color: var(--ac-text); }
  #ac-root .ac-stepbtn small { grid-column: 2; font-size: calc(11 * var(--ac-u)); color: var(--ac-text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ac-root .ac-stepbtn.ac-on { background: color-mix(in srgb, var(--ac-accent) 12%, transparent); }
  #ac-root .ac-stepbtn.ac-on i { border-color: var(--ac-accent); color: var(--ac-accent); }
  #ac-root .ac-stepbtn.ac-done i { background: var(--ac-accent); border-color: var(--ac-accent); color: #fff; }
  #ac-root .ac-btn { border: 1px solid var(--ac-line); background: var(--ac-bg); color: var(--ac-text); border-radius: 8px; padding: 8px 14px;
    font: inherit; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
  #ac-root .ac-btn:disabled { opacity: .45; cursor: default; }
  #ac-root .ac-btn.ac-primary { background: var(--ac-accent); border-color: var(--ac-accent); color: #fff; }
  #ac-root .ac-btn.ac-small { padding: 4px 10px; font-size: calc(12 * var(--ac-u)); }
  #ac-root .ac-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #ac-root .ac-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 20px 10px; }
  #ac-root .ac-head h1 { margin: 0; font-size: calc(20 * var(--ac-u)); font-weight: 600; }
  #ac-root .ac-head p { margin: 4px 0 0; color: var(--ac-text2); }
  #ac-root .ac-iconbtn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--ac-line); display: inline-flex; align-items: center; justify-content: center;
    color: var(--ac-text2); cursor: pointer; flex: none; transition: background-color .12s, border-color .12s, color .12s; }
  #ac-root .ac-iconbtn:hover { border-color: #e5484d; color: #e5484d; background: color-mix(in srgb, #e5484d 10%, transparent); }
  #ac-root .ac-conn { margin-left: auto; align-self: center; font-size: calc(11 * var(--ac-u)); padding: 4px 10px; border-radius: 20px; background: var(--ac-soft); color: var(--ac-text2); white-space: nowrap; }
  #ac-root .ac-conn::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #9ca3af; margin-right: 6px; }
  #ac-root .ac-conn.ac-yes::before { background: var(--ac-ok); }
  #ac-root .ac-body { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 25vw, 480px); gap: 14px; padding: 4px 20px 14px; }
  #ac-root .ac-viewer { position: relative; border-radius: 12px; background: radial-gradient(ellipse at 50% 40%, var(--ac-bg), var(--ac-soft)); border: 1px solid var(--ac-line);
    min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  #ac-root .ac-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #ac-root .ac-hints { position: absolute; left: 12px; bottom: 12px; z-index: 2; font-size: calc(11 * var(--ac-u)); color: var(--ac-text2);
    background: color-mix(in srgb, var(--ac-bg) 80%, transparent); border-radius: 6px; padding: 4px 8px; }
  #ac-root .ac-tabs { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; z-index: 2; }
  #ac-root .ac-tab { border: 1px solid var(--ac-line); background: var(--ac-bg); color: var(--ac-text2); border-radius: 8px; padding: 5px 12px; font: inherit; font-size: calc(12 * var(--ac-u)); cursor: pointer; }
  #ac-root .ac-tab.ac-on { border-color: var(--ac-accent); color: var(--ac-text); box-shadow: 0 0 0 1px var(--ac-accent) inset; }
  #ac-root .ac-drop { position: absolute; inset: 12px; border: 2px dashed var(--ac-line); border-radius: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; color: var(--ac-text2); z-index: 3; background: color-mix(in srgb, var(--ac-bg) 70%, transparent); text-align: center; }
  #ac-root .ac-drop.ac-over { border-color: var(--ac-accent); color: var(--ac-text); }
  #ac-root .ac-drop b { color: var(--ac-text); font-size: calc(15 * var(--ac-u)); }
  #ac-root .ac-busy { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 4; background: color-mix(in srgb, var(--ac-bg) 55%, transparent); font-weight: 500; gap: 10px; }
  #ac-root .ac-busy.ac-show { display: flex; }
  #ac-root .ac-spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ac-line); border-top-color: var(--ac-accent); animation: ac-spin .8s linear infinite; }
  @keyframes ac-spin { to { transform: rotate(360deg); } }
  #ac-root .ac-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; padding-right: 2px; }
  #ac-root .ac-card { background: var(--ac-soft); border-radius: 12px; padding: 12px 14px; }
  #ac-root #ac-next.ac-loadbtn { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.25; padding-top: 5px; padding-bottom: 5px; }
  #ac-root #ac-next .ac-fname { display: block; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: calc(11 * var(--ac-u)); font-weight: 500; opacity: 0.85; margin-bottom: 1px; }
  #ac-root .ac-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; }
  #ac-root .ac-stats b { display: block; font-size: calc(22 * var(--ac-u)); font-weight: 650; font-variant-numeric: tabular-nums; }
  #ac-root .ac-stats b small { font-size: calc(12 * var(--ac-u)); font-weight: 500; color: var(--ac-text2); }
  #ac-root .ac-stats span { font-size: calc(11.5 * var(--ac-u)); color: var(--ac-text2); }
  #ac-root .ac-stats p { grid-column: 1 / -1; margin: 6px 0 0; padding-top: 8px; border-top: 1px solid var(--ac-line); font-family: ui-monospace, Menlo, monospace; font-size: calc(11.5 * var(--ac-u)); color: var(--ac-text2); overflow-wrap: anywhere; }
  #ac-root .ac-card h4 { margin: 0 0 10px; font-size: calc(11 * var(--ac-u)); font-weight: 600; letter-spacing: .06em; color: var(--ac-text2); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  #ac-root .ac-card h4 .ac-btn { margin-left: auto; text-transform: none; letter-spacing: 0; }
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  #ac-root .ac-hint { color: var(--ac-text2); font-size: calc(12 * var(--ac-u)); margin-top: 8px; }
  #ac-root .ac-found { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  #ac-root .ac-found li { display: flex; align-items: center; gap: 8px; }
  #ac-root .ac-found li i { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  #ac-root .ac-found li span { flex: 1; }
  #ac-root .ac-found li em { color: var(--ac-ok); font-style: normal; }
  #ac-root .ac-note { border-radius: 12px; padding: 10px 12px; font-size: calc(12 * var(--ac-u)); display: flex; gap: 8px; background: color-mix(in srgb, var(--ac-hole) 10%, var(--ac-bg)); color: var(--ac-text); }
  #ac-root .ac-note.ac-warn { background: color-mix(in srgb, var(--ac-warn) 12%, var(--ac-bg)); }
  #ac-root .ac-note ul { margin: 4px 0 0 14px; padding: 0; }
  #ac-root .ac-note li { margin: 2px 0; }
  #ac-root .ac-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #ac-root .ac-fields label { display: flex; flex-direction: column; gap: 3px; font-size: calc(11 * var(--ac-u)); color: var(--ac-text2); }
  #ac-root.ac-wrap input[type=number], #ac-root.ac-wrap select { background: var(--ac-bg); color: var(--ac-text); border: 1px solid var(--ac-line); border-radius: 7px; padding: 6px 8px; font: inherit; width: 100%; min-width: 0; }
  #ac-root .ac-opts { display: flex; flex-direction: column; gap: 6px; }
  #ac-root .ac-opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--ac-line); background: var(--ac-bg); border-radius: 9px; padding: 8px 10px; cursor: pointer; }
  #ac-root .ac-opt input { margin-top: 2px; accent-color: var(--ac-accent); }
  #ac-root .ac-opt b { display: block; font-weight: 500; }
  #ac-root .ac-opt span { color: var(--ac-text2); font-size: calc(11 * var(--ac-u)); }
  #ac-root .ac-opt.ac-on { border-color: var(--ac-accent); box-shadow: 0 0 0 1px var(--ac-accent) inset; }
  #ac-root .ac-big { font-family: ui-monospace, monospace; font-size: calc(12 * var(--ac-u)); margin-top: 8px; }
  #ac-root .ac-tools { width: 100%; border-collapse: collapse; font-size: calc(12 * var(--ac-u)); table-layout: fixed; }
  #ac-root .ac-tools th { text-align: left; color: var(--ac-text2); font-weight: 500; padding: 5px 4px; border-bottom: 1px solid var(--ac-line); }
  #ac-root .ac-tools td { padding: 5px 4px; border-bottom: 1px solid var(--ac-line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ac-root .ac-tools tr.ac-off td { opacity: .45; }
  #ac-root .ac-tools input[type=number] { padding: 4px 6px; }
  #ac-root .ac-badge { display: inline-block; font-size: calc(10 * var(--ac-u)); padding: 1px 7px; border-radius: 10px; border: 1px solid var(--ac-line); color: var(--ac-text2); }
  #ac-root .ac-badge.ac-used { background: var(--ac-accent); border-color: var(--ac-accent); color: #fff; }
  #ac-root .ac-ops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  #ac-root .ac-ops li { display: grid; grid-template-columns: 16px 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; background: var(--ac-bg); border-radius: 8px; padding: 7px 9px; }
  #ac-root .ac-ops li i { width: 10px; height: 10px; border-radius: 2px; }
  #ac-root .ac-ops li small { display: block; color: var(--ac-text2); font-size: calc(11 * var(--ac-u)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ac-root .ac-ops li em { font-style: normal; font-size: calc(12 * var(--ac-u)); color: var(--ac-text2); font-variant-numeric: tabular-nums; }
  #ac-root .ac-total { display: flex; justify-content: space-between; font-weight: 600; margin-top: 8px; }
  #ac-root .ac-foot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--ac-line); }
  #ac-root .ac-foot .ac-status { flex: 1; min-width: 0; color: var(--ac-text2); font-size: calc(12 * var(--ac-u)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Hover, pressed and keyboard focus for everything clickable. */
  #ac-root .ac-btn, #ac-root .ac-stepbtn, #ac-root .ac-tab, #ac-root .ac-siderow, #ac-root .ac-seg button, #ac-root .ac-opt, #ac-root .ac-zgrid button {
    transition: background-color .12s, border-color .12s, filter .12s, transform .05s; }
  #ac-root .ac-btn:hover:not(:disabled) { border-color: var(--ac-accent); background: color-mix(in srgb, var(--ac-accent) 12%, var(--ac-bg)); }
  #ac-root .ac-btn.ac-primary:hover:not(:disabled) { background: var(--ac-accent); filter: brightness(1.12); }
  #ac-root .ac-btn:active:not(:disabled), #ac-root .ac-siderow:active, #ac-root .ac-tab:active, #ac-root .ac-seg button:active:not(:disabled) { transform: translateY(1px); filter: brightness(0.95); }
  #ac-root .ac-btn:disabled, #ac-root .ac-seg button:disabled { cursor: not-allowed; }
  #ac-root .ac-stepbtn:hover:not(:disabled):not(.ac-on) { background: color-mix(in srgb, var(--ac-accent) 8%, transparent); color: var(--ac-text); }
  #ac-root .ac-tab:hover:not(.ac-on), #ac-root .ac-siderow:hover:not(.ac-on), #ac-root .ac-opt:hover:not(.ac-on) { border-color: color-mix(in srgb, var(--ac-accent) 60%, var(--ac-line)); }
  #ac-root .ac-seg button:hover:not(.ac-on):not(:disabled) { background: color-mix(in srgb, var(--ac-accent) 12%, var(--ac-bg)); color: var(--ac-text); }
  #ac-root button:focus-visible, #ac-root .ac-opt:focus-within, #ac-root select:focus-visible, #ac-root input:focus-visible { outline: 2px solid var(--ac-accent); outline-offset: 2px; }
  #ac-root .ac-play { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 10px;
    background: var(--ac-bg); border: 1px solid var(--ac-line); border-radius: 10px; padding: 6px 10px; }
  #ac-root .ac-seg { display: inline-flex; border: 1px solid var(--ac-line); border-radius: 8px; overflow: hidden; }
  #ac-root .ac-seg button { border: 0; background: var(--ac-bg); color: var(--ac-text2); font: inherit; font-size: calc(12 * var(--ac-u)); padding: 4px 10px; cursor: pointer; }
  #ac-root .ac-seg button.ac-on { background: var(--ac-accent); color: #fff; }
  /* Timeline: one coloured band per operation under the slider; what is still to come is dimmed. */
  #ac-root .ac-track { position: relative; flex: 1; min-width: 80px; height: 24px; display: flex; align-items: center; }
  #ac-root .ac-segs { position: absolute; left: 7px; right: 7px; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; overflow: hidden; background: var(--ac-line); }
  #ac-root .ac-segs i { position: absolute; top: 0; bottom: 0; }
  #ac-root .ac-segs b { position: absolute; top: 0; bottom: 0; right: 0; background: color-mix(in srgb, var(--ac-bg) 62%, transparent); }
  #ac-root .ac-track input[type=range] { position: relative; width: 100%; margin: 0; height: 24px; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
  #ac-root .ac-track input[type=range]::-webkit-slider-runnable-track { height: 6px; background: transparent; }
  #ac-root .ac-track input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -4px; border-radius: 50%; background: #fff; border: 2px solid var(--ac-accent); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  #ac-root .ac-track input[type=range]:disabled { cursor: default; }
  #ac-root .ac-play .ac-pbtn { width: 30px; height: 30px; padding: 0; border-radius: 50%; }
  #ac-root .ac-play select { width: auto; padding: 4px 6px; font-size: calc(12 * var(--ac-u)); }
  #ac-root .ac-play .ac-plabel { font-size: calc(11 * var(--ac-u)); color: var(--ac-text2); white-space: nowrap; min-width: 190px; text-align: right; font-variant-numeric: tabular-nums; }
  #ac-root .ac-check { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: calc(12.5 * var(--ac-u)); cursor: pointer; }
  #ac-root .ac-checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  #ac-root .ac-checks li { background: var(--ac-bg); border-radius: 8px; padding: 6px 9px; font-size: calc(12 * var(--ac-u)); }
  #ac-root .ac-checks summary { cursor: pointer; display: flex; gap: 8px; align-items: baseline; list-style: none; }
  #ac-root .ac-checks summary::-webkit-details-marker { display: none; }
  #ac-root .ac-checks b { width: 14px; flex-shrink: 0; text-align: center; }
  #ac-root .ac-checks .ac-pass b { color: var(--ac-ok); } #ac-root .ac-checks .ac-wn b { color: var(--ac-warn); } #ac-root .ac-checks .ac-fail b { color: #e5484d; }
  #ac-root .ac-checks ul { margin: 6px 0 2px 22px; padding: 0; color: var(--ac-text2); }
  #ac-root .ac-checks ul li { background: none; padding: 1px 0; font-size: calc(11 * var(--ac-u)); }
  #ac-root .ac-verdict { font-weight: 600; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
  #ac-root .ac-override { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; font-size: calc(12 * var(--ac-u)); }
  #ac-root .ac-hidden { display: none !important; }
  /* Part file */
  #ac-root .ac-file { display: flex; align-items: center; gap: 10px; }
  #ac-root .ac-file div { min-width: 0; flex: 1; }
  #ac-root .ac-file b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ac-root .ac-file span { font-family: ui-monospace, monospace; font-size: calc(11.5 * var(--ac-u)); color: var(--ac-text2); }
  /* Side to face up: a list with a reach badge per side */
  #ac-root .ac-sidelist { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #ac-root .ac-siderow { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border: 1px solid var(--ac-line); border-radius: 8px; background: var(--ac-bg); cursor: pointer; text-align: left; }
  #ac-root .ac-siderow span { flex: 1; font-weight: 500; }
  #ac-root .ac-siderow em { font-style: normal; font-size: calc(10.5 * var(--ac-u)); padding: 1px 6px; border-radius: 9px; background: var(--ac-soft); color: var(--ac-text2); white-space: nowrap; }
  #ac-root .ac-siderow em.ac-best { background: color-mix(in srgb, var(--ac-ok) 18%, transparent); color: var(--ac-ok); font-weight: 600; }
  #ac-root .ac-siderow em.ac-two { color: var(--ac-warn); }
  #ac-root .ac-siderow.ac-on { border-color: var(--ac-accent); box-shadow: 0 0 0 1px var(--ac-accent) inset; }
  #ac-root .ac-siderow:hover:not(.ac-on) { border-color: color-mix(in srgb, var(--ac-accent) 60%, var(--ac-line)); }
  #ac-root .ac-why { margin-top: 8px; font-size: calc(12 * var(--ac-u)); color: var(--ac-text2); }
  /* Material: option list with a colour dot */
  #ac-root .ac-opts.ac-two { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  #ac-root .ac-opt > i { width: 14px; height: 14px; border-radius: 50%; flex: none; margin-top: 2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
  #ac-root button.ac-opt { text-align: left; width: 100%; }
  /* Operations: the machining sequence, each with its share of the job time */
  #ac-root .ac-budget { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--ac-line); margin: 4px 0 6px; }
  #ac-root .ac-budget i { display: block; height: 100%; }
  #ac-root .ac-budget-head { display: flex; justify-content: space-between; align-items: baseline; }
  #ac-root .ac-budget-head b { font-size: calc(22 * var(--ac-u)); font-variant-numeric: tabular-nums; }
  #ac-root .ac-seq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  #ac-root .ac-seq li { display: grid; grid-template-columns: 18px 20px minmax(0, 1fr) auto; gap: 5px 8px; align-items: center; background: var(--ac-bg); border-radius: 9px; padding: 8px 10px; }
  #ac-root .ac-seq li.ac-off { opacity: .55; }
  #ac-root .ac-seq li > input { margin: 0; accent-color: var(--ac-accent); width: 15px; height: 15px; }

    return b && Z > 0 ? Math.max(0, (b[5] - b[2]) - 0.4 * Z) / Z : 0;
  }

  /** Longest flute of the end mills in use: how deep one setup can cut. */
  function reach() {
    var f = camTools().filter(function (t) { return t.kind === 'flat'; }).map(function (t) { return t.fluteLength || 0; });
    return f.length ? Math.max.apply(null, f) : Infinity;
  }

  /** Share of the part out of reach with side `up` on top in n setups: hidden by overhangs, or deeper than the flutes reach. */
  function unreached(up, n) {
    var b = state.sideBox[up], hidden = n === 2 ? (state.sides2[up] || 0) : state.sides[up];
    var height = b ? b[5] - b[2] : 0, deep = height > 0 ? Math.min(1, n * reach() / height) : 1;
    return 1 - (1 - hidden) * deep;
  }

  /** Why side `up` can or can't reach everything, in one and two setups. */
  function reachText(up) {
    var h = state.sides[up], h2 = state.sides2[up] || 0, b = state.sideBox[up], height = b ? b[5] - b[2] : 0, F = reach();
    var tall = tallness(up) > 0 ? '. Standing ' + fmt(height) + ' mm tall it is tall for the ' + fmt(state.fw.travelZ) + ' mm Z travel' : '';
    if (unreached(up, 1) <= 0.002) return 'Everything can be reached from this side' + tall;
    var why = [];
    if (h > 0.002) why.push('overhangs hide about ' + Math.round(h * 100) + '% of the shape');
    if (height > F) why.push('the part is ' + fmt(height) + ' mm tall but the longest flute is ' + fmt(F) + ' mm');
    var t = 'From this side ' + why.join(', and ');
    var u2 = unreached(up, 2);
    return t + (u2 <= 0.002 ? '; turned over for a second setup, everything is reachable' : u2 < unreached(up, 1) - 0.002 ? '; with a second setup about ' + Math.round(u2 * 100) + '% stays out of reach' : '') + tall;
  }

  /** True when side `up` can't reach everything in one setup but two setups (turned over) reach clearly more. */
  function needsTwoSetups(up) {
    return !!up && unreached(up, 1) > 0.002 && unreached(up, 2) < unreached(up, 1) - 0.002;
  }

  /** Which face of the model points along machine direction d (a row of the matrix), or null if none does. */
  function faceName(d) {
    var names = { '0+': 'Right (+X)', '0-': 'Left (−X)', '1+': 'Back (+Y)', '1-': 'Front (−Y)', '2+': 'Top (+Z)', '2-': 'Bottom (−Z)' };
    for (var k = 0; k < 3; k++) if (Math.abs(d[k]) > 0.999) return names[k + (d[k] > 0 ? '+' : '-')];
    return null;
  }

  /** How the part sits on the table in setup i: model face up, model face toward the operator, size along X, Y, Z. */
  function placement(i) {
    var M = setupMatrix(i), bb = state.analysis.bbox;
    return {
      up: faceName(M[2]) || 'the face you clicked', front: faceName(M[1].map(function (v) { return -v; })) || 'turned to suit',
      size: [bb[3] - bb[0], bb[4] - bb[1], bb[5] - bb[2]]
    };
  }

  /** Placement lines for the G-code header, one list per setup. */
  function placementNotes() {
    return (twoSetups() ? [0, 1] : [0]).map(function (i) {
      var pl = placement(i), st = stockBox();
      var dims = i === 1 && cfg.setups === 'X' ? 'same block, turned over front to back' : i === 1 ? 'same block, turned over left to right' :
        'X ' + fmt(st.x1 - st.x0) + ' x Y ' + fmt(st.y1 - st.y0) + ' x Z ' + fmt(st.z1 - st.z0) + ' mm';
      return ['PLACEMENT: model ' + pl.up + ' face up, model ' + pl.front + ' face toward you', 'STOCK ON TABLE: ' + dims];
    });
  }

  // ------------------------------------------------------------------ planning
  // The plan step plans in the background as soon as it opens and after every change, so its rows show the real
  // operations, tools and times. A newer request (or a new analysis) makes an older result stale.
  var planToken = 0;
  async function makePlan() {
    var token = ++planToken;
    clearTimeout(state.planTimer);
    state.planning = true; state.planError = '';
    if (state.step === 2) renderPanel();
    try {
      var r = await call('plan', {
        up: upMatrix(), flip: twoSetups() ? cfg.setups : null, ncTools: state.ncTools, placement: placementNotes(),
        cfg: Object.assign({}, cfg, { up: undefined }), machine: machineCfg(), name: state.fileName.replace(/\.(step|stp)$/i, '')
      });
      if (token !== planToken) return false;
      state.plans = r.plans; state.gcodes = r.gcodes; state.active = 0; state.hidden = {};
      state.sims = []; state.uiChecks = []; state.override = {}; state.simMode = 'paths'; state.checking = null;
    } catch (e) {
      if (token !== planToken) return false;
      state.planError = e.message;
      console.error('[AutoCAM]', e);
    }
    state.planning = false;
    if (state.step === 2) { refreshScene(!state.prevPlans); renderAll(); }
    state.prevPlans = null;
    return state.plans.length > 0;
  }

  function planSoon() { clearTimeout(state.planTimer); state.planTimer = setTimeout(makePlan, 300); }

  /** Make toolpaths: use the plan made in the background (or make it now), then simulate and check it. */
  async function generate() {
    setStatus('');
    if (!state.plans.length || state.planning) {
      busy('Planning toolpaths…');
      var ok = await makePlan();
      busy('');
      if (!ok) { setStatus('Planning failed: ' + (state.planError || 'unknown error')); return; }
    }
    state.maxStep = 3; state.active = 0; state.hidden = {}; state.simMode = 'paths';
    goto(3);
    if (state.checking !== state.plans) runChecks();
    setStatus(state.gcodes.map(function (g, i) { return programName(i) + ' · ' + g.split('\n').length.toLocaleString() + ' lines'; }).join('  ·  '));
  }

  function invalidate() {
    planToken++;
    state.planning = false;
    if (!state.plans.length) return;
    state.prevPlans = state.plans;
    state.plans = []; state.gcodes = []; state.sims = []; state.uiChecks = []; state.checking = null;
    state.maxStep = Math.min(state.maxStep, 2);
  }

  function setOrigin(name) {
    cfg.origin = name;
    changed();
  }

  /** After a setting changes: save it, drop the old plan, and show the change. */
  function changed() {
    saveSettings();
    invalidate();
    if (state.step === 1 || state.step === 2) refreshScene(false);
    if (state.step === 2) planSoon();
    renderAll();
  }

  function programName(i) {
    var base = state.fileName.replace(/\.(step|stp)$/i, '');
    return base + (state.gcodes.length > 1 ? ' setup ' + (i + 1) : '') + '.nc';
  }

  async function loadIntoSender() {
    // The zero may have moved since the last poll: check the keep-out zones once more with the machine state right now.
    if ((state.keepout || []).length) {
      state.live = await readServerState();
      var ko = keepoutHits(state.active);
      if (ko && ko.hits.length) { setStatus('Not loaded: with the current G54 zero the job goes into the ' + ko.hits[0].zone + '.'); renderAll(); return; }
    }
    setStatus('Sending to ncSender…');
    var res = await fetch(BASE_URL + '/api/gcode-files/load-temp', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: programName(state.active), content: state.gcodes[state.active] })
    });
    if (!res.ok) { setStatus('ncSender refused the program (' + res.status + ').'); return; }
    setStatus('Loaded ' + programName(state.active) + '.');
    // Remember the zero this setup ran with, so setup 2 can tell whether G54 was set again after turning the part over.
    var ms = await readServerState();
    cfg.loaded = { file: state.fileName, setup: state.active, g54: ms ? vec(ms.g54) : null, at: Date.now() };
    await putSettings();
    setTimeout(function () { close(); }, 150);
  }

  async function saveToFiles() {
    var saved = [];
    for (var i = 0; i < state.gcodes.length; i++) {
      var path = 'AutoCAM/' + programName(i);
      var res = await fetch(BASE_URL + '/api/gcode-files/file/save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: path, content: state.gcodes[i] })
      });
      if (!res.ok) { setStatus('Save failed (' + res.status + ').'); return; }
      saved.push(path);
    }
    setStatus('Saved to File Manager › ' + saved.join(', '));
  }

  function download() {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([state.gcodes[state.active]], { type: 'text/plain' }));
    a.download = programName(state.active);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function close() { shutdown(); window.postMessage({ type: 'close-plugin-dialog' }, '*'); }

  // ------------------------------------------------------------------ rendering
  function goto(step) {
    if (step > state.maxStep) return;
    stopPlay();
    state.step = step;
    refreshScene(true);
    renderAll();
    setTimeout(resize, 0); // the viewer is hidden on the Operations step; size it again when it comes back
  }

  function renderAll() {
    var s = STEPS[state.step];
    $('ac-title').textContent = s.title;
    $('ac-sub').textContent = s.sub;
    $('ac-steps').innerHTML = STEPS.map(function (st, i) {
      return '<button class="ac-stepbtn' + (i === state.step ? ' ac-on' : i < state.step ? ' ac-done' : '') + '" data-step="' + i + '"' +
        (i > state.maxStep ? ' disabled' : '') + '><i>' + (i < state.step ? '✓' : i + 1) + '</i><span>' + st.short + '</span><small>' + esc(stepSummary(i)) + '</small></button>';
    }).join('');
    $('ac-hints').classList.toggle('ac-hidden', !state.source || state.step === 3);
    $('ac-hints').textContent = 'Drag: rotate · Right-drag: pan · Scroll: zoom' +
      (state.step === 0 ? ' · Click a flat face: put it on top' : state.step === 1 ? ' · Click a dot: put the zero there' : '');
    renderTabs();
    renderPanel();
    renderFooter();
    renderPlayBar();
  }

  function renderFooter() {
    var next = $('ac-next'), two = state.gcodes.length > 1;
    $('ac-back').disabled = state.step === 0;
    $('ac-save').classList.toggle('ac-hidden', state.step !== 3);
    $('ac-download').classList.toggle('ac-hidden', state.step !== 3);
    // The buttons carry the program's file name, exactly as ncSender and the File Manager will show it.
    var name = state.gcodes.length ? programName(state.active) : '';
    var all = state.gcodes.map(function (g, i) { return programName(i); });
    $('ac-save').textContent = two ? 'Save both to File Manager' : 'Save to File Manager';
    $('ac-save').title = 'Saves to File Manager › AutoCAM/' + all.join(' and AutoCAM/');
    $('ac-download').textContent = 'Download';
    $('ac-download').title = 'Downloads ' + name;
    next.classList.toggle('ac-loadbtn', state.step === 3);
    if (state.step === 0) { next.textContent = 'Next: Stock ›'; next.disabled = !state.analysis; }
    if (state.step === 1) { next.textContent = 'Next: Operations ›'; next.disabled = false; }
    if (state.step === 2) { next.textContent = 'Make toolpaths ›'; next.disabled = !camTools().some(function (t) { return t.kind === 'flat'; }); }
    if (state.step === 3) {
      var v = verdict(state.active);
      next.innerHTML = '<span class="ac-fname">' + esc(name) + '</span>Load into ncSender';
      next.disabled = !state.gcodes.length || !v || v.keepout || (v.fails > 0 && !state.override[state.active]);
      next.title = !v ? 'Checking the program first…' : !v.fails && !v.keepout ? 'Loads ' + name + ' into ncSender' : v.keepout ? 'The job goes into the ATC / keep-out zone with this zero' :
        v.fails && !state.override[state.active] ? 'Fix the failed checks, or tick “load anyway”' : '';
    }
  }

  function renderTabs() {
    var t = $('ac-tabs');
    var show = state.step === 3 && state.plans.length > 1;
    t.classList.toggle('ac-hidden', !show);
    if (!show) return;
    t.innerHTML = state.plans.map(function (p, i) {
      return '<button class="ac-tab' + (i === state.active ? ' ac-on' : '') + '" data-setup="' + i + '">Setup ' + (i + 1) + ' · ' + fmtTime(p.seconds) + '</button>';
    }).join('');
  }


  function renderPanel() {
    var P = $('ac-panel');
    if (state.step === 0) P.innerHTML = panelModel();
    else if (state.step === 1) P.innerHTML = panelStock();
    else if (state.step === 2) P.innerHTML = panelOps();
    else P.innerHTML = panelPreview();
  }

  /** One line under each step in the rail: what was chosen there. */
  function stepSummary(i) {
    if (i === 0) return state.fileName ? state.fileName.replace(/\.(step|stp)$/i, '') : 'No file open';
    if (i === 1) {
      var m = window.AutoCAM && AutoCAM.MATERIALS[cfg.material], st = state.analysis ? stockBox() : null;
      return (m ? m.label.replace(/\s*\(.*\)$/, '') : '') + (st ? ' · ' + fmt(st.x1 - st.x0) + '×' + fmt(st.y1 - st.y0) + '×' + fmt(st.z1 - st.z0) : '');
    }
    var plans = state.plans.length ? state.plans : state.prevPlans || [];
    if (i === 2) return plans.length ? plans.reduce(function (t, p) { return t + p.ops.length; }, 0) + ' steps · ' + fmtTime(plans.reduce(function (t, p) { return t + p.seconds; }, 0)) : 'Tools and finish';
    var v = state.plans.length ? verdict(state.active) : null;
    return !v ? 'Check, then load' : v.fails ? v.fails + ' problem' + (v.fails > 1 ? 's' : '') : v.warns ? 'Ready · ' + v.warns + ' warning' + (v.warns > 1 ? 's' : '') : 'All checks passed';
  }

  /** How the part sits on the table: what is up, what faces the operator, size along each machine axis. */
  function placementCard(i, sheet) {
    var pl = placement(i), L = longAxis(), long = pl.size[L === 'X' ? 0 : 1] >= pl.size[L === 'X' ? 1 : 0] - 0.5;
    var rows = [['Facing up', 'model ' + pl.up], ['Toward you', 'model ' + pl.front],
      ['On the table', 'X ' + fmt(pl.size[0]) + ' × Y ' + fmt(pl.size[1]) + ' × Z ' + fmt(pl.size[2]) + ' mm']];
    var html = '<div class="ac-card"><h4>' + (sheet ? 'Setup sheet' + (state.plans.length > 1 ? ' · setup ' + (i + 1) : '') : 'How it sits on the table') + '</h4>' +
      '<dl class="ac-place">' + rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>';
    if (sheet) {
      var st = state.plans[i].stock, extra = [['Stock', fmt(st.x1 - st.x0) + ' × ' + fmt(st.y1 - st.y0) + ' × ' + fmt(st.z1 - st.z0) + ' mm'],
        ['G54 zero', zeroText()]];
      if (i === 1) extra.unshift(['Before', cfg.setups === 'X' ? 'turn the block over front to back: the back edge now faces you' : 'turn the block over left to right: the right edge is now on the left']);
      html = html.replace('</dl>', extra.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>');
    } else {
      html += '<div class="ac-place-foot"><span class="' + (long ? 'ac-okc' : 'ac-wnc') + '">' + (long ? '✓ Long side along ' + L + ', the machine’s long axis'
        : '⚠ Long side along ' + (L === 'X' ? 'Y' : 'X') + '; turn it to clamp along ' + L) + '</span>' +
        '<button class="ac-btn ac-small" id="ac-turn" title="Turn the part a quarter turn on the table">↻ Turn 90°</button></div>';
    }
    return html + '</div>';
  }

  function panelModel() {
    var best = bestSide();
    var html = state.source ? '<div class="ac-card"><div class="ac-file"><div><b title="' + esc(state.fileName) + '">' + esc(state.fileName) + '</b><span>' + esc(state.fsize || '') + '</span></div>' +
      '<button class="ac-btn ac-small" id="ac-open2">Open another…</button></div></div>' : '';
    html += '<div class="ac-card"><h4>Which side faces up?</h4><div class="ac-sidelist">' + SIDES.map(function (s) {
      var h = state.sides[s[0]], on = state.up === s[0];
      var known = h !== undefined, u1 = known ? unreached(s[0], 1) : 1, u2 = known ? unreached(s[0], 2) : 1;
      var status = !state.source ? '' : !known ? '…' : s[0] === best ? 'best' : u1 <= 0.002 ? 'reachable' : u2 <= 0.002 ? '2 setups' : 'hidden areas';
      var cls = s[0] === best ? 'ac-best' : u1 > 0.002 && u2 <= 0.002 ? 'ac-two' : '';
      return '<button class="ac-siderow' + (on ? ' ac-on' : '') + '" data-up="' + s[0] + '" title="' + esc(known ? reachText(s[0]) : '') + '"><span>' + s[1] + '</span>' +
        (status ? '<em class="' + cls + '">' + status + '</em>' : '') + '</button>';
    }).join('') + '</div><div class="ac-why">' + (typeof state.up !== 'string' ? '<b>Custom:</b> the face you clicked is on top. Pick a side to go back.'
      : state.sides[state.up] !== undefined && unreached(state.up, 1) <= 0.002 ? esc(reachText(state.up)) + '.' : 'Or click a flat face on the model to put it on top.') + '</div></div>';
    if (state.analysis) html += placementCard(0, false);

    if (state.analysis) {
      var a = state.analysis, items = [];
      if (a.pockets.length) {
        var through = a.pockets.filter(function (p) { return p.through; }).length;
        items.push(['var(--ac-pocket)', a.pockets.length + ' pocket' + (a.pockets.length > 1 ? 's' : '') +
          (through === a.pockets.length ? ', through' : through ? ', ' + through + ' through' : '')]);
      }
      Object.keys(a.holeGroups).forEach(function (k) {
        var n = a.holeGroups[k], parts = k.split(' ');
        items.push(['var(--ac-hole)', n + ' hole' + (n > 1 ? 's' : '') + ', Ø' + parts[0] + ' mm' + (parts[1] ? ' through' : '')]);
      });
      items.push(['var(--ac-outline)', 'Outline, ' + fmt(a.height) + ' mm ' + (a.pockets.length || a.holes.length ? 'cut-out' : 'profile')]);
      html += '<div class="ac-card"><h4>Found in this part</h4><ul class="ac-found">' + items.map(function (it) {
        return '<li><i style="background:' + it[0] + '"></i><span>' + esc(it[1]) + '</span><em>✓</em></li>';
      }).join('') + '</ul></div>';
      var hid = typeof state.up === 'string' ? state.sides[state.up] : undefined;
      if (hid !== undefined && unreached(state.up, 1) > 0.002) {
        var u2 = unreached(state.up, 2);
        html += '<div class="ac-note ac-warn"><span>⚠</span><span>' + esc(reachText(state.up)) + '. ' +
          (twoSetups() ? 'Two setups are on.' : u2 < unreached(state.up, 1) - 0.002 ? 'Choose <b>Two setups</b> on the next step to machine the other side too, or pick another side.' : 'Pick another side if one reaches more.') +
          '</span></div>';
      }
      if (a.sloped) html += '<div class="ac-note"><span>ⓘ</span><span>Sloped or curved faces are cut as steps for now (no 3D finishing yet).</span></div>';
    } else {
      html += '<div class="ac-card"><h4>Found in this part</h4><div class="ac-hint" style="margin:0">Open a STEP file to see its pockets, holes and outline.</div></div>';
    }
    return html;
  }

  function field(k, label, step, title, min) {
    return '<label' + (title ? ' title="' + esc(title) + '"' : '') + '>' + label + '<input type="number" step="' + (step || 0.1) + '" min="' + (min === undefined ? 0 : min) +
      '" data-cfg="' + k + '" value="' + cfg[k] + '"></label>';
  }

  function option(name, value, current, title, sub) {
    return '<label class="ac-opt' + (value === current ? ' ac-on' : '') + '"><input type="radio" name="' + name + '" value="' + value + '"' +
      (value === current ? ' checked' : '') + '><div><b>' + title + '</b><span>' + sub + '</span></div></label>';
  }

  function panelStock() {
    var st = state.analysis ? stockBox() : null;
    var mats = Object.keys(AutoCAM.MATERIALS).map(function (k) {
      var look = MAT_LOOK[k] || ['#9ca3af', ''], name = AutoCAM.MATERIALS[k].label.replace(/\s*\(.*\)$/, '');
      return '<button class="ac-opt' + (k === cfg.material ? ' ac-on' : '') + '" data-material="' + k + '"><i style="background:' + look[0] + '"></i>' +
        '<div><b>' + esc(name) + '</b><span>' + esc(look[1]) + '</span></div></button>';
    }).join('');
    var dots = Object.keys(AUTOCAM_ORIGINS).map(function (n) {
      var a = AUTOCAM_ORIGINS[n];
      return '<button class="' + (n === cfg.origin ? 'ac-on' : '') + '" data-origin="' + n + '" title="' + esc(AutoCAM.originText(n, cfg.zZero)) + '" style="left:' + (a[0] * 100) + '%;top:' + ((1 - a[1]) * 100) + '%"></button>';
    }).join('');
    return '<div class="ac-card"><h4>Material</h4><div class="ac-opts ac-two">' + mats + '</div></div>' +
      '<div class="ac-card"><h4>Stock block</h4><div class="ac-fields">' +
      field('stockXY', 'Margin each side (mm)', 0.5) + field('stockTop', 'Above the part (mm)') +
      (twoSetups() ? field('stockBottom', 'Below the part (mm)') : '') + '</div>' +
      (st ? '<div class="ac-big">' + fmt(st.x1 - st.x0) + ' × ' + fmt(st.y1 - st.y0) + ' × ' + fmt(st.z1 - st.z0) + ' mm' +
        (st.margin > cfg.stockXY ? ' (margin ' + st.margin + ' mm for the frame)' : '') + '</div>' : '') + '</div>' +
      '<div class="ac-card"><h4>Work zero (G54)</h4><div class="ac-zero"><div class="ac-zgrid">' + dots + '<em>front · you</em></div>' +
      '<div><b>' + esc(zeroText()) + '</b><div class="ac-hint" style="margin-top:4px">X and Y: pick one of the nine points here or on the stock in the 3D view.</div></div></div>' +
      '<div class="ac-opts">' + option('zzero', 'top', cfg.zZero === 'bed' ? 'bed' : 'top', 'Z on the stock top', 'Touch off on the top face of the block') +
      option('zzero', 'bed', cfg.zZero === 'bed' ? 'bed' : 'top', 'Z on the spoilboard', 'Touch off on the table under the block; the block’s thickness then doesn’t matter') + '</div></div>' +
      '<div class="ac-card"><h4>Setups</h4><div class="ac-opts">' +
      option('setups', '1', cfg.setups, 'One setup', 'Machine everything from the top') +
      option('setups', 'X', cfg.setups, 'Two setups, turn over front to back', 'Flip about X; a frame and web hold the part') +
      option('setups', 'Y', cfg.setups, 'Two setups, turn over left to right', 'Flip about Y; a frame and web hold the part') + '</div>' +
      (twoSetups() ? '<div class="ac-fields" style="margin-top:8px">' + field('split', 'Setup 1 depth (0 = auto)', 0.5,
        'Depth below the part top where setup 1 stops and setup 2 takes over') + field('frame', 'Frame width (mm)', 1) + field('web', 'Web (mm)', 0.1) + '</div>' : '') +
      '</div>';
  }

  /** The machining sequence: one line per operation (both setups together), its tool, its share of the job time. */
  function planRows() {
    if (state.planError) return '<div class="ac-note ac-warn"><span>⚠</span><span>' + esc(state.planError) + '</span></div>';
    // While a change is re-planned, the previous plan stays on screen.
    var plans = state.plans.length ? state.plans : state.prevPlans || [], updating = state.planning || !state.plans.length;
    if (!plans.length) return '<div class="ac-card"><div class="ac-planbusy"><span class="ac-spin"></span>Working out the sequence…</div></div>';
    var tools = camTools(), two = plans.length > 1, items = [];
    plans.forEach(function (p, si) {
      p.ops.forEach(function (op) {
        var it = items.filter(function (x) { return x.name === op.name; })[0];

  /** "T3 Down-Cut Spiral 1/4 6.3mm 37mm D6.3" -> "Down-Cut Spiral 1/4 6.3mm 37mm". */

  /** Around the part: a slot round the outline (a profile cut, VCarve style) or clearing all the stock; tabs. */

  function panelOps() {

  /** The tools the plan uses, with where they sit in ncSender. */
  function usedTools() {

    if (!list.length) return '<div class="ac-hint" style="margin:0">' + (state.ncTools.length ? 'Shown once the plan is ready.' : 'No tools reachable by M6 T&lt;n&gt; in ncSender.') + '</div>';
    return '<ul class="ac-found">' + list.map(function (t) {
      return '<li><span><b style="color:var(--ac-accent)">T' + t.number + '</b> ' + esc(shortTool(t.label)) + '</span>' +
        (t.number === state.spindleTool ? '<span class="ac-badge ac-used">in spindle</span>' : '<span class="ac-badge">' + (state.numbering === 'slot' ? 'slot ' : 'T') + t.number + '</span>') + '</li>';

  // ------------------------------------------------------------------ cutting simulation
  function mmss(sec) { var m = Math.floor(sec / 60), x = Math.round(sec % 60); return m + ':' + (x < 10 ? '0' : '') + x; }

  /** Stock surface for one setup: a grid mesh whose heights follow the simulation frames. */
  function addSimulation(sim, p) {
    var T = window.__autocamTHREE, g = sim.grid;
    if (!sim.geom) {
      var nv = g.nx * g.ny, pos = new Float32Array(nv * 3), idx = new Uint32Array((g.nx - 1) * (g.ny - 1) * 6), k = 0;
      for (var j = 0; j < g.ny; j++) for (var i = 0; i < g.nx; i++) { var c = j * g.nx + i; pos[3 * c] = g.x0 + i * g.cell; pos[3 * c + 1] = g.y0 + j * g.cell; }
      for (var j2 = 0; j2 < g.ny - 1; j2++) for (var i2 = 0; i2 < g.nx - 1; i2++) {
        var a = j2 * g.nx + i2, b = a + 1, d = a + g.nx, e = d + 1;
        idx[k++] = a; idx[k++] = b; idx[k++] = e; idx[k++] = a; idx[k++] = e; idx[k++] = d;
      }
      sim.geom = new T.BufferGeometry();
      sim.geom.setAttribute('position', new T.BufferAttribute(pos, 3));
      sim.geom.setAttribute('color', new T.BufferAttribute(new Float32Array(nv * 3), 3));
      sim.fullIdx = idx;
      sim.geom.setIndex(new T.BufferAttribute(idx.slice(), 1));
      // Side walls of the block: the outer ring of cells, each down to the stock bottom.
      var ring = [];
      for (var a1 = 0; a1 < g.nx; a1++) ring.push(a1);
      for (var b1 = 1; b1 < g.ny; b1++) ring.push(b1 * g.nx + g.nx - 1);
      for (var a2 = g.nx - 2; a2 >= 0; a2--) ring.push((g.ny - 1) * g.nx + a2);
      for (var b2 = g.ny - 2; b2 > 0; b2--) ring.push(b2 * g.nx);
      ring.push(0);
      var sp = new Float32Array(ring.length * 6), si = [];
      ring.forEach(function (c, n) {
        sp[6 * n] = sp[6 * n + 3] = pos[3 * c]; sp[6 * n + 1] = sp[6 * n + 4] = pos[3 * c + 1];
        if (n) si.push(2 * n - 2, 2 * n - 1, 2 * n, 2 * n - 1, 2 * n + 1, 2 * n);
      });
      sim.ring = ring;
      sim.skirt = new T.BufferGeometry();
      sim.skirt.setAttribute('position', new T.BufferAttribute(sp, 3));
      sim.skirt.setIndex(si);
    }
    V.overlay.add(new T.Mesh(sim.geom, new T.MeshStandardMaterial({ vertexColors: true, roughness: 0.7, metalness: 0.05, side: T.DoubleSide })));
    sim.skirtMat = new T.MeshStandardMaterial({ roughness: 0.8, metalness: 0.05, side: T.DoubleSide });
    V.overlay.add(new T.Mesh(sim.skirt, sim.skirtMat));

    sim.toolMesh = null;
    showFrame(state.frame === null ? sim.frames.length - 1 : state.frame, true);
  }

  function showFrame(f, quiet) {
    var sim = state.sims[state.active], p = state.plans[state.active];
    if (!sim || !sim.geom || !V) return;
    f = Math.max(0, Math.min(sim.frames.length - 1, f));
    state.frame = f;
    var g = sim.grid, q = sim.frames[f], span = g.zHigh - g.zLow, pos = sim.geom.attributes.position.array, col = sim.geom.attributes.color.array;
    var last = f === sim.frames.length - 1, zb = p.stock.z0, zt = p.stock.z1, mc = matRGB();
    var hole = new Uint8Array(q.length), holes = 0;
    for (var c = 0; c < q.length; c++) {
      var z = g.zLow + q[c] / 65535 * span;
      // Cut right through: the cell is empty. Its corner stays on the stock bottom so the walls around it reach down.
      if (z < zb + 0.02) { hole[c] = 1; holes++; z = zb; }
      pos[3 * c + 2] = z;
      var r, gr, b;
      if (sim.gouge[c]) { r = 0.9; gr = 0.18; b = 0.2; }
      else if (last && sim.uncut[c]) { r = 0.98; gr = 0.58; b = 0.15; }
      else { var t = 0.6 + 0.4 * Math.max(0, Math.min(1, (z - zb) / ((zt - zb) || 1))); r = mc[0] * t; gr = mc[1] * t; b = mc[2] * t; } // deeper cuts darker
      col[3 * c] = r; col[3 * c + 1] = gr; col[3 * c + 2] = b;
    }
    // Drop the triangles that lie wholly in cut-through cells, so the finished part stands free.
    var full = sim.fullIdx, ia = sim.geom.index.array, m = 0;
    if (holes) {
      for (var t3 = 0; t3 < full.length; t3 += 3) {
        if (hole[full[t3]] && hole[full[t3 + 1]] && hole[full[t3 + 2]]) continue;
        ia[m++] = full[t3]; ia[m++] = full[t3 + 1]; ia[m++] = full[t3 + 2];
      }
    } else { ia.set(full); m = full.length; }
    sim.geom.setDrawRange(0, m);
    sim.geom.index.needsUpdate = true;
    sim.geom.attributes.position.needsUpdate = true;
    sim.geom.attributes.color.needsUpdate = true;
    sim.geom.computeVertexNormals();
    var skp = sim.skirt.attributes.position.array;
    sim.ring.forEach(function (c, n) { skp[6 * n + 2] = pos[3 * c + 2]; skp[6 * n + 5] = zb; });
    sim.skirt.attributes.position.needsUpdate = true;
    sim.skirt.computeVertexNormals();
    sim.skirtMat.color.setRGB(mc[0] * 0.75, mc[1] * 0.75, mc[2] * 0.75);
    var info = sim.info[f], op = p.ops[info.op];
    Object.keys(sim.tools).forEach(function (k) { sim.tools[k].visible = false; });
    if (!last) {
      var tm = sim.tools[op.tool.number] || (sim.tools[op.tool.number] = toolModel(op.tool, COLORS[info.op % COLORS.length]));
      if (!tm.parent) V.overlay.add(tm);
      tm.position.set(info.x, info.y, info.z);
      tm.visible = true;
    }
    $('ac-slider').max = sim.frames.length - 1;
    $('ac-slider').value = f;
    var dim = $('ac-segdim');
    if (dim) dim.style.left = (f / Math.max(1, sim.frames.length - 1) * 100) + '%';
    $('ac-plabel').textContent = (last ? 'Finished' : op.name + ' · T' + op.tool.number) + ' · ' + mmss(info.t) + ' / ' + mmss(sim.total);
    if (!quiet) render();
  }

  /** The cutter at its real size, tip at the origin: fluted part, shank with a band in the operation's colour,
   *  collet nut and a stub of the spindle nose. */
  function toolModel(tool, band) {
    var T = window.__autocamTHREE, g = new T.Group();
    var steel = new T.MeshStandardMaterial({ color: 0xc9ced6, metalness: 0.6, roughness: 0.35 });
    var dark = new T.MeshStandardMaterial({ color: 0x30353d, metalness: 0.4, roughness: 0.5 });
    function cyl(r1, r2, h, z, mat) {
      var m = new T.Mesh(new T.CylinderGeometry(r1, r2, h, 32), mat);
      m.rotation.x = Math.PI / 2; m.position.z = z + h / 2; g.add(m);
    }
    var cone = tool.kind === 'spot' || tool.kind === 'drill', shank = Math.max(3.175, Math.min(tool.diameter, 12.7) / 2);
    var flute = Math.min(tool.fluteLength || tool.diameter * 3, 30), r = tool.kind === 'spot' && tool.diameter < 1 ? 3.175 : tool.diameter / 2;
    if (cone) {
      var tip = r / Math.tan((tool.pointAngle || 118) / 2 * Math.PI / 180);
      cyl(r, 0.05, tip, 0, steel);
      if (tool.kind === 'drill') cyl(r, r, Math.max(1, flute - tip), tip, steel);
      flute = Math.max(tip, tool.kind === 'drill' ? flute : tip);
    } else {
      cyl(r, r, flute, 0, steel);
    }
    cyl(shank, shank, 14, flute, steel);
    cyl(shank + 0.4, shank + 0.4, 2.5, flute + 5, new T.MeshStandardMaterial({ color: band }));
    cyl(10, 7, 12, flute + 14, dark);
    cyl(22, 22, 25, flute + 26, dark);
    return g;
  }

  function stopPlay() { clearInterval(state.playing); state.playing = null; var b = $('ac-pbtn'); if (b) b.textContent = '▶'; }
  function play() {
    var sim = state.sims[state.active];
    if (!sim) return;
    if (state.playing) { stopPlay(); return; }
    if (state.simMode !== 'sim') { state.simMode = 'sim'; refreshScene(false); renderPlayBar(); }
    if (state.frame === null || state.frame >= sim.frames.length - 1) showFrame(0);
    $('ac-pbtn').textContent = '❚❚';
    // 1× plays a setup in about 10 s; faster speeds skip frames once the timer runs at 60 per second.
    var speed = state.speed || 1, ms = 70 / speed, step = 1;
    if (ms < 16) { step = Math.ceil(16 / ms); ms = 16; }
    state.playing = setInterval(function () {
      if (!V || !ROOT.isConnected || state.frame >= sim.frames.length - 1) { stopPlay(); return; }
      showFrame(Math.min(sim.frames.length - 1, state.frame + step));
    }, ms);
  }

  function renderPlayBar() {
    var bar = $('ac-play'), sim = state.sims[state.active];
    bar.classList.toggle('ac-hidden', state.step !== 3 || !state.plans.length);
    bar.querySelectorAll('[data-mode]').forEach(function (b) {
      b.classList.toggle('ac-on', b.dataset.mode === state.simMode);
      if (b.dataset.mode === 'sim') { b.disabled = !sim; b.textContent = sim ? 'Simulation' : 'Simulating…'; }
    });
    $('ac-pbtn').disabled = !sim;
    $('ac-speed').value = String(state.speed || 1);
    $('ac-slider').disabled = !sim || state.simMode !== 'sim';
    if (!sim || state.simMode !== 'sim') $('ac-plabel').textContent = sim ? 'Total ' + mmss(sim.total) : 'Simulating the cut…';
    renderSegments(sim);
